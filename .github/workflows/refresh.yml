name: Refresh dashboard

on:
  schedule:
    - cron: "15 12 1,16 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh market data
        run: python updater.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh cap allocation dashboard"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify refresh health
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/latest.json")
          if not p.exists():
              print("::error::data/latest.json is missing")
              raise SystemExit(1)
          data = json.loads(p.read_text(encoding="utf-8"))
          source = data.get("source_status") or {}
          status = source.get("status")
          version = data.get("methodology_version")
          message = source.get("message")
          core = (source.get("components") or {}).get("core_index_data") or {}
          print(f"Dashboard methodology={version}, source_status={status}, as_of={data.get('as_of')}")
          print(f"Source message: {message}")
          if core.get("message"):
              print(f"Core detail: {core.get('message')}")
          if version != "2.3":
              print(f"::error::Expected methodology 2.3 but found {version}. The new updater did not produce a fresh snapshot.")
              raise SystemExit(1)
          if status == "cached":
              print("::error::Core market-data refresh failed. The site was left on last-good data.")
              raise SystemExit(1)
          if status == "partial":
              print("::warning::Core data refreshed, but one or more optional breadth sources were cached/unavailable.")
          PY
