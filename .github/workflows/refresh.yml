name: Refresh dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 1,16 * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh market data
        run: python updater.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/latest.json'))
          assert d.get('methodology_version')=='4.1', f"Expected methodology 4.1, got {d.get('methodology_version')}"
          assert set(d.get('segments',{}))=={'large','mid','small'}
          print('Validated methodology',d['methodology_version'],'as of',d.get('as_of'))
          PY
      - name: Commit refreshed data
        run: |
          git config user.name "market-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history.json
          git diff --cached --quiet || git commit -m "Refresh dashboard data"
          git pull --rebase origin main || true
          git push origin HEAD:main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
